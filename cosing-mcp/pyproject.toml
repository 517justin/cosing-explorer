[project]
name = "cosing-mcp"
version = "0.1.0"
description = "MCP server for CosIng cosmetic ingredient knowledge base"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0",
    "httpx>=0.27",
    "platformdirs>=4.0",
]

[project.scripts]
cosing-mcp = "cosing_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cosing_mcp"]
